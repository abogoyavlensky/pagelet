name: deploy

on:
  push:
    branches: [master]

# Two master pushes deploy one after the other, never at once; a deploy
# that started is never cancelled halfway.
concurrency:
  group: deploy-personal
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    # Pinned like test.yml: the image needs a binary linked against a glibc
    # no newer than trixie's 2.41.
    runs-on: ubuntu-24.04
    needs: [test]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # lgx, Go, Node and uc at the versions in .mise.toml.
      - uses: jdx/mise-action@v3

      # Same runtime cache as test.yml: the build below is a cache hit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.lgx/runtimes
          key: runtimes-${{ runner.os }}-${{ hashFiles('lgx.edn') }}
          restore-keys: runtimes-${{ runner.os }}-

      # The image is a copy of this binary, built here on ubuntu-24.04
      # (glibc 2.39, which the trixie image satisfies); nothing built on a
      # newer laptop ever ships.
      - name: Build the dashboard and the binary
        run: |
          lgx ui-install
          lgx build

      # An image build alone cannot tell a binary that builds from one that
      # starts. Runs before buildx is set up so the default docker driver
      # loads the image for `docker run`.
      - name: Smoke-test the image
        run: scripts/docker-smoke.sh

      # The default docker driver can't export cache (type=gha); this sets up
      # a docker-container builder that can.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to the `uc` run step
      # so the gha cache backend can authenticate.
      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and deploy
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: uc --context personal --connect root@${{ vars.SERVER_IP }} deploy -f compose.yaml --yes pagelet

      # The first deploy waits for Caddy to get the certificate; later ones
      # for the stop-first restart. About two minutes before giving up.
      - name: Check the deployed app
        run: curl -fsS --retry 60 --retry-all-errors --retry-delay 2 "https://${{ vars.APP_DOMAIN }}/api/health"
